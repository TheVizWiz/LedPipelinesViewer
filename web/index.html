<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>LedPipelines Preview</title>
	<style>
		:root { color-scheme: dark; }
		body {
			margin: 0;
			background: #0b0d10;
			color: #c7ccd1;
			font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
			padding: 16px;
		}
		#bar {
			position: sticky;
			top: 0;
			display: flex;
			align-items: center;
			gap: 16px;
			padding: 8px 0 14px;
			background: #0b0d10;
			z-index: 1;
		}
		#status {
			padding: 4px 8px;
			border-radius: 4px;
		}
		#status.ok { background: #10331d; color: #6ee7a0; }
		#status.bad { background: #3a1414; color: #f19b9b; }
		.control { display: flex; align-items: center; gap: 8px; }
		.control input[type=range] { width: 220px; }
		.control .value { width: 4.5ch; text-align: right; opacity: 0.7; }
		.strip { margin-bottom: 28px; }
		.strip-label { margin-bottom: 8px; opacity: 0.6; }
		/* Row gap is generous so vertical glow between wrapped rows has room to bleed. */
		.pixels { display: flex; flex-wrap: wrap; gap: 6px; }
		.px {
			/* --px-size is driven by the size slider (see JS). */
			width: var(--px-size, 14px);
			height: var(--px-size, 14px);
			border-radius: 2px;
			background: #000;
			/* box-shadow is set per-frame in JS: an inset hairline (grid outline) plus, for lit pixels, one or more
			   colored glow layers whose size/opacity scale with brightness x bloom. */
			box-shadow: inset 0 0 0 1px rgba(255,255,255,0.04);
		}
	</style>
</head>
<body>
	<div id="bar">
		<div id="status" class="bad">connecting…</div>
		<div class="control">
			<label for="bloom">bloom</label>
			<input id="bloom" type="range" min="0" max="200" value="100">
			<span id="bloom-value" class="value">100%</span>
		</div>
		<div class="control">
			<label for="size">size</label>
			<input id="size" type="range" min="4" max="48" value="14">
			<span id="size-value" class="value">14px</span>
		</div>
	</div>
	<div id="strips"></div>

	<script>
		const stripsEl = document.getElementById('strips');
		const statusEl = document.getElementById('status');
		const bloomInput = document.getElementById('bloom');
		const bloomValueEl = document.getElementById('bloom-value');
		const sizeInput = document.getElementById('size');
		const sizeValueEl = document.getElementById('size-value');

		// Overall bloom multiplier (0..2), driven by the slider. Every glow dimension is scaled by this, so 0 = no
		// glow at all and larger values scale the whole effect up uniformly.
		let bloom = bloomInput.value / 100;

		// Current pixel size in px, driven by the size slider. The glow dimensions scale with this (relative to the
		// reference size below) so the bloom stays visually proportional as the rectangles grow or shrink.
		const REFERENCE_PX_SIZE = 14;
		let pxSize = +sizeInput.value;

		// The inset hairline that outlines every cell (visible even on unlit pixels so the grid is legible).
		const GRID_OUTLINE = 'inset 0 0 0 1px rgba(255,255,255,0.04)';

		// Cached DOM: one .strip block per strip, one .px div per pixel. We rebuild the DOM only when the strip
		// layout (count/lengths) changes, and otherwise just restyle existing pixels each frame - so 30-60fps stays
		// smooth without thrashing the DOM.
		let layout = [];        // array of pixel counts, describes current DOM
		let pixelEls = [];      // pixelEls[stripIndex][pixelIndex] -> div
		let lastFrame = null;   // keep the last frame so slider changes can re-render without waiting for a new one

		function sameLayout(strips) {
			if (strips.length !== layout.length) return false;
			for (let i = 0; i < strips.length; i++) if (strips[i].length !== layout[i]) return false;
			return true;
		}

		function rebuild(strips) {
			stripsEl.innerHTML = '';
			pixelEls = [];
			layout = strips.map(s => s.length);
			strips.forEach((strip, i) => {
				const block = document.createElement('div');
				block.className = 'strip';
				const label = document.createElement('div');
				label.className = 'strip-label';
				label.textContent = 'strip ' + i + ' · ' + strip.length + ' px';
				const pixels = document.createElement('div');
				pixels.className = 'pixels';
				const row = [];
				for (let j = 0; j < strip.length; j++) {
					const px = document.createElement('div');
					px.className = 'px';
					pixels.appendChild(px);
					row.push(px);
				}
				block.appendChild(label);
				block.appendChild(pixels);
				stripsEl.appendChild(block);
				pixelEls.push(row);
			});
		}

		// Build the box-shadow for one pixel. The glow is the pixel's own color; its extent and opacity scale with the
		// pixel's brightness (HSV value = max channel, which is 0 for an unlit/#000000 pixel -> no glow) times the
		// global bloom slider. Two layers give a bright tight core plus a soft wide halo.
		function shadowFor(r, g, b) {
			const brightness = Math.max(r, g, b) / 255;   // 0 when the LED is off
			const strength = brightness * bloom;          // 0 => no bloom; scales with the slider
			if (strength <= 0.001) return GRID_OUTLINE;

			// Scale the glow geometry with the pixel size (relative to the reference) so the bloom stays proportional
			// as the rectangles resize. At the default size this factor is 1, leaving the original look unchanged.
			const sizeScale = pxSize / REFERENCE_PX_SIZE;
			const coreBlur = strength * 10 * sizeScale, coreSpread = strength * 3 * sizeScale;
			const haloBlur = strength * 28 * sizeScale, haloSpread = strength * 8 * sizeScale;
			const coreAlpha = Math.min(1, 0.35 + 0.65 * strength);
			const haloAlpha = Math.min(0.85, 0.55 * strength);

			return GRID_OUTLINE
				+ `, 0 0 ${coreBlur}px ${coreSpread}px rgba(${r},${g},${b},${coreAlpha})`
				+ `, 0 0 ${haloBlur}px ${haloSpread}px rgba(${r},${g},${b},${haloAlpha})`;
		}

		function stylePixel(el, hex) {
			el.style.background = hex;
			// hex is "#rrggbb"
			const r = parseInt(hex.slice(1, 3), 16);
			const g = parseInt(hex.slice(3, 5), 16);
			const b = parseInt(hex.slice(5, 7), 16);
			el.style.boxShadow = shadowFor(r, g, b);
		}

		function render(frame) {
			lastFrame = frame;
			const strips = frame.strips || [];
			if (!sameLayout(strips)) rebuild(strips);
			for (let i = 0; i < strips.length; i++) {
				const row = pixelEls[i];
				const strip = strips[i];
				for (let j = 0; j < strip.length; j++) {
					stylePixel(row[j], strip[j]);
				}
			}
		}

		bloomInput.addEventListener('input', () => {
			bloom = bloomInput.value / 100;
			bloomValueEl.textContent = bloomInput.value + '%';
			// Re-render the last frame immediately so the slider feels live even if the stream is idle/paused.
			if (lastFrame) render(lastFrame);
		});

		// Pixel size: drive the --px-size CSS variable so every .px cell resizes (pure CSS), and re-render the last
		// frame so each pixel's glow (a per-frame box-shadow) rescales with the new size too.
		function applyPixelSize() {
			pxSize = +sizeInput.value;
			document.documentElement.style.setProperty('--px-size', pxSize + 'px');
			sizeValueEl.textContent = pxSize + 'px';
			if (lastFrame) render(lastFrame);
		}
		sizeInput.addEventListener('input', applyPixelSize);
		applyPixelSize();

		function connect() {
			const es = new EventSource('/stream');
			es.onopen = () => { statusEl.className = 'ok'; statusEl.textContent = 'live'; };
			es.onmessage = e => {
				try { render(JSON.parse(e.data)); } catch (err) { /* ignore malformed frame */ }
			};
			es.onerror = () => {
				statusEl.className = 'bad';
				statusEl.textContent = 'disconnected — reconnecting…';
				// EventSource auto-reconnects; no manual retry needed.
			};
		}

		connect();
	</script>
</body>
</html>
