[platformio]
default_envs = viewer

; Native desktop previewer for the LedPipelines library. It compiles LedPipelines (pulled from the PlatformIO
; registry as a normal library dependency) against the host-side stubs in stubs/, where FastLED.show() pushes each
; rendered frame to a browser over SSE instead of latching hardware. See README.md.
[env:viewer]
platform = native

; LedPipelines ships its sources (no prebuilt binary); the LDF compiles src/**/*.cpp and puts include/ on the path.
; library.json excludes src/main.cpp (real chipset registration + setup()/loop()) from the export, so it isn't built.
;
; Toggle between the published registry version and a local checkout by swapping which line is commented. The local
; symlink builds against your working tree (useful for testing unpublished library changes); the registry line pulls
; the published release. After switching, run `pio pkg install -e viewer` (or delete .pio/libdeps) so the LDF re-resolves.
lib_deps =
    thevizwiz/LedPipelines
;     symlink:///Users/vsi/personal/ledpipelines

; LedPipelines' library.json declares a fastled/FastLED dependency. On the host we substitute our own FastLED.h
; stub (in stubs/), so ignore the real one and let the LDF resolve the bare #include "FastLED.h" to our stub.
lib_ignore = FastLED
lib_compat_mode = off

; Adds the `serve` custom target: `pio run -t serve` builds the viewer, then runs it (serving http://127.0.0.1:8420).
extra_scripts = post:scripts/serve.py

; The project sources live in src/; also compile stubs/ (stubs_impl.cpp defines the FastLED/Serial globals and the
; real-clock timing functions). Without this, those symbols are undefined at link time.
build_src_filter =
    +<*>
    +<../stubs>

build_flags =
    -std=gnu++2a
    ; server thread + render loop
    -pthread
    ; Put our stubs FIRST so the library's #include "FastLED.h" / "Arduino.h" resolve to the host versions.
    -I stubs
    ; viewer sources, so #include "viewer/..." resolves (FrameQueue, Server, Runner).
    -I src
    ; cpp-httplib single header.
    -I vendor
