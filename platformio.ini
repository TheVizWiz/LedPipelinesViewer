[platformio]
default_envs = viewer

; Native desktop previewer for the LedPipelines library. It compiles LedPipelines (pulled as a normal library
; dependency) and renders through viewer::ViewerOutput - an ledpipelines::LedOutput backend that, instead of driving
; hardware, publishes each rendered frame to a browser over SSE. See README.md.
[env:viewer]
platform = native

; LedPipelines ships its sources (no prebuilt binary); the LDF compiles src/**/*.cpp and puts include/ on the path.
; library.json excludes src/main.cpp (a hardware sketch) from the export, so it isn't built.
;
; Toggle between the published registry version and a local checkout by swapping which line is commented. The local
; symlink builds against your working tree (useful for testing unpublished library changes); the registry line pulls
; the published release. After switching, run `pio pkg install -e viewer` (or delete .pio/libdeps) so the LDF re-resolves.
lib_deps =
;    thevizwiz/LedPipelines
     symlink:///Users/vsi/personal/ledpipelines

; The viewer needs no FastLED: LedPipelines 0.2.0+ has no FastLED dependency (it renders through a LedOutput backend),
; and the viewer supplies its own backend (ViewerOutput). Only the Arduino host surface (String/Serial/timing) is
; stubbed - see stubs/Arduino.h.
lib_compat_mode = off

; Build/run scripts:
;   - build_setup.py (pre): compiles the out-of-tree stubs (stubs/stubs_impl.cpp) by absolute path on every platform,
;     and on Windows links ws2_32/wsock32 for cpp-httplib's winsock calls. Runs before compilation.
;   - serve.py (post): adds the `serve` target - `pio run -t serve` builds the viewer, then runs it at
;     http://127.0.0.1:8420.
extra_scripts =
    pre:scripts/build_setup.py
    post:scripts/serve.py

; Compile the project's own src/ tree. The out-of-tree stubs/ (which define the Serial global and the
; real-clock timing functions) are compiled by build_setup.py via BuildSources() instead of a "+<../stubs>" filter:
; reaching outside src/ with ".." in build_src_filter works on macOS but silently compiles nothing on Windows/MinGW,
; which left millis()/micros() undefined at link time.
build_src_filter =
    +<*>

build_flags =
    ; Plain C++17 is enough: the library (Builders included) and the viewer use no GNU extensions and no C++20-only
    ; features, so no gnu++ dialect or c++20 is required. Verified by building clean at -std=c++17.
    -std=c++17
    ; std::thread / std::mutex / std::condition_variable in the server + render loop. A no-op on macOS/clang (threads
    ; link via libc there) but genuinely required on Linux and MinGW - without it std::thread fails to link.
    -pthread
    ; Put our stubs on the path so the library's #include "Arduino.h" resolves to the host version.
    -I stubs
    ; viewer sources, so #include "viewer/..." resolves (FrameQueue, Server, Runner).
    -I src
    ; cpp-httplib single header.
    -I vendor
